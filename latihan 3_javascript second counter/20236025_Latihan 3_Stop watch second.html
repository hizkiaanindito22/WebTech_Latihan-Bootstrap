<!DOCTYPE html>
<html>
    <head>
        <title>Latihan stopwatch second</title>
    </head>

    <body>

        <h2>Stopwatch Second</h2>
        <h1 id="d">0</h1>

        <button onclick="s()">Start</button>
        <button onclick="p()">Stop</button>
        <button onclick="r()">Reset</button>

        <script>
            let t = 0;
            let i = null;

            const d = document.getElementById('d');

            function u() {
                t++;
                d.textContent = t;
            }

            function s() {
                if (i === null){
                    i = setInterval(u, 1000);
                }
            }

            function p() {
                clearInterval(i);
                i = null;
            }

            function r() {
                p();
                t = 0;
                d.textContent = t;
            }
        </script>
    </body>

</html>
